name: Fetch structures
# Commits the BinaryCIF files for Module B into data/structures/. Run it from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths: [tools/fetch-structures.sh]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/fetch-structures.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/structures
          git diff --cached --quiet || git commit -m "Fetch 5XTD and 4UG0 BinaryCIF from RCSB"
          git push
