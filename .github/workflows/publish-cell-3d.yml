name: Publish cell-3d
on:
  push:
    tags: ['cell-3d-v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@isaac070405'
      - run: node --test packages/cell-3d/test/*.test.js && node scripts/check-data.mjs
      - run: npm publish
        working-directory: packages/cell-3d
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
