title: "[Q&A] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Search existing discussions first. A broken control or wrong number belongs in an issue form instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you want to know and what you already tried.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Include the query string, for example `?cell=hepatocyte&org=mito`.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15
  - type: dropdown
    id: theme
    attributes:
      label: Theme and language
      options:
        - Light, English
        - Light, 繁體中文
        - Light, bilingual
        - Dark, English
        - Dark, 繁體中文
        - Dark, bilingual
