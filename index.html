<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cell Atlas · Human Biology</title>
  <meta name="description" content="Zoom from a whole cell to the atomic structure of a protein complex. Every number carries its source.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/three/OrbitControls.js","three/addons/":"./vendor/three/"}}</script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#viewer">Skip to viewer</a>

  <header class="hud">
    <div class="hud-id">
      <span class="hud-parent" data-i18n="site.parent"></span>
      <h1 class="hud-title" data-i18n="site.title"></h1>
    </div>
    <dl class="hud-readout">
      <div><dt data-i18n="hud.cell"></dt><dd id="ro-cell">–</dd></div>
      <div><dt data-i18n="hud.scale"></dt><dd id="ro-scale">µm</dd></div>
      <div><dt data-i18n="hud.viewing"></dt><dd id="ro-view" data-i18n="hud.nothing"></dd></div>
    </dl>
    <div class="hud-controls">
      <div class="seg" role="radiogroup" aria-label="Language">
        <button role="radio" data-lang-set="en" data-i18n="lang.en"></button>
        <button role="radio" data-lang-set="zh-Hant" data-i18n="lang.zh"></button>
        <button role="radio" data-lang-set="both" data-i18n="lang.both"></button>
      </div>
      <button class="icon-btn" id="theme-btn" data-i18n-attr="aria-label:theme.toggle" title="">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <nav class="ruler" aria-labelledby="ruler-label">
    <span id="ruler-label" class="sr-only" data-i18n="nav.label"></span>
    <svg id="ruler-svg" viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="ruler-bands" role="tablist" id="ruler-bands"></div>
  </nav>

  <main class="stage" id="viewer" tabindex="-1">
    <section class="viewport" aria-live="polite">
      <div class="viewport-frame">
        <div class="viewport-head">
          <h2 class="viewport-title" id="vp-title"></h2>
          <div class="seg" role="radiogroup" id="vp-switch" data-i18n-attr="aria-label:view.label">
            <button role="radio" data-view="cells" data-i18n="view.cells"></button>
            <button role="radio" data-view="compare" data-i18n="view.compare"></button>
          </div>
        </div>
        <p class="viewport-empty" id="vp-empty"></p>
        <ul class="queue" id="vp-queue"></ul>
        <div class="kind-legend" id="kind-legend" hidden></div>
        <div id="vp-cell" class="cell3d-wrap" hidden>
          <div class="cell3d-main">
            <div class="cell3d" id="cell3d" tabindex="0"></div>
            <aside class="xsec" aria-labelledby="xsec-title">
              <h4 id="xsec-title" data-i18n="cell3d.xsec"></h4>
              <canvas id="xsec-canvas" aria-hidden="true"></canvas>
              <input type="range" id="cut" min="0" max="100" value="50" data-i18n-attr="aria-label:cell3d.cut">
              <div class="xsec-ends"><span data-i18n="cell3d.xsec.end1"></span><span data-i18n="cell3d.xsec.end2"></span></div>
              <ul class="xsec-legend" id="xsec-legend"></ul>
              <label class="xsec-opt"><input type="checkbox" id="xsec-3d" checked> <span data-i18n="cell3d.xsec.cut3d"></span></label>
              <button class="chip" id="cell-reset" data-i18n="cell3d.reset"></button>
            </aside>
          </div>
          <p class="muted cell3d-note" id="cell3d-note"></p>
        </div>
        <div id="vp-mol" class="mol-wrap" hidden>
          <ul class="queue tour" id="tour-bar" data-i18n-attr="aria-label:tour.label"></ul>
          <div class="mol" id="mol"></div>
          <p class="muted cell3d-note" id="mol-note"></p>
        </div>
        <div id="vp-tissue" class="cell3d-wrap" hidden>
          <div class="tview" id="tissue-views" role="group" data-i18n-attr="aria-label:tview.label" hidden></div>
          <div class="cell3d-main" id="tissue-main">
            <div class="cell3d-stage">
              <div class="cell3d" id="tissue3d" tabindex="0"></div>
              <aside class="tissue-dir" id="tissue-dir" hidden></aside>
            </div>
            <aside class="xsec" id="tissue-xsec" aria-labelledby="txsec-title" hidden>
              <h4 id="txsec-title" data-i18n="cell3d.xsec"></h4>
              <select id="txsec-axis" class="xsec-sel" data-i18n-attr="aria-label:cell3d.xsec"></select>
              <canvas id="txsec-canvas" aria-hidden="true"></canvas>
              <input type="range" id="txsec-cut" min="0" max="100" value="50" data-i18n-attr="aria-label:cell3d.cut">
              <div class="xsec-ends"><span id="txsec-ends"></span></div>
              <label class="xsec-opt"><input type="checkbox" id="txsec-3d"> <span data-i18n="tview.plane"></span></label>
              <button class="chip" id="txsec-reset" data-i18n="cell3d.reset"></button>
            </aside>
          </div>
          <p class="muted cell3d-note" id="tissue-note"></p>
        </div>
        <iframe id="vp-anatomy" class="anatomy-frame" title="3D Anatomy Model" loading="lazy" hidden></iframe>
        <div id="vp-compare" hidden></div>
      </div>
      <p class="schematic" data-i18n="notice.schematic"></p>
    </section>

    <section class="panels" aria-label="Information">
      <article class="panel" id="panel-chart">
        <h3 id="chart-title"></h3>
        <div class="panel-body" id="chart-body"></div>
      </article>
      <article class="panel" id="panel-card">
        <h3 data-i18n="panel.card"></h3>
        <div class="panel-body" id="card-body"></div>
      </article>
      <article class="panel" id="panel-sources">
        <h3 data-i18n="panel.sources"></h3>
        <ol class="panel-body sources" id="sources-body"></ol>
      </article>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
